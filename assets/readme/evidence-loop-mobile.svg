<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-gated proactive experiment loop</title>
  <desc id="desc">A vertical mobile view of capability selection, deterministic execution, evidence recording, release checks, and one confirmed proposal.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,0 L5,10 Z" fill="#2f7d55"/>
    </marker>
  </defs>
  <rect width="400" height="650" rx="14" fill="#f5f7f5"/>
  <text x="24" y="38" fill="#17231c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="760">Question to defensible action</text>
  <text x="24" y="64" fill="#526158" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Only released evidence can drive a proposal.</text>

  <path d="M200 166 V188 M200 282 V304 M200 398 V420 M200 514 V536" fill="none" stroke="#2f7d55" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="24" y="92" width="352" height="78" rx="7" fill="#ffffff" stroke="#b8c6bd"/>
    <text x="42" y="118" fill="#2f7d55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">01 / PICOCLAW</text>
    <text x="42" y="148" fill="#17231c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700">Select a current capability</text>
  </g>

  <g>
    <rect x="24" y="208" width="352" height="78" rx="7" fill="#edf6f0" stroke="#2f7d55" stroke-width="2"/>
    <text x="42" y="234" fill="#2f7d55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">02 / NANO-OS-AGENT</text>
    <text x="42" y="264" fill="#17231c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700">Execute bounded task steps</text>
  </g>

  <g>
    <rect x="24" y="324" width="352" height="78" rx="7" fill="#ffffff" stroke="#b8c6bd"/>
    <text x="42" y="350" fill="#2f7d55" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">03 / EVIDENCE</text>
    <text x="42" y="380" fill="#17231c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700">Record result and provenance</text>
  </g>

  <g>
    <rect x="24" y="440" width="352" height="78" rx="7" fill="#fffaf0" stroke="#c38b2b" stroke-width="1.5"/>
    <text x="42" y="466" fill="#a26d16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">04 / RELEASE GATE</text>
    <text x="42" y="496" fill="#17231c" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700">Keep or quarantine the run</text>
  </g>

  <g>
    <rect x="24" y="556" width="352" height="70" rx="7" fill="#173e2a"/>
    <text x="42" y="582" fill="#a7e1be" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">05 / PROACTIVE OUTPUT</text>
    <text x="42" y="610" fill="#ffffff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">One proposal; confirm before action</text>
  </g>
</svg>
