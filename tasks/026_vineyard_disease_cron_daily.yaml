- id: vineyard_disease_cron_daily
  name: "Vineyard Disease Cron Daily"
  priority: 8
  status: template
  steps:
    - id: health
      action: call_skill
      parameters:
        skill_name: vineyard_disease_risk
        repo_path: /root/goidanich
        mode: health
      expect:
        status: success
      timeout: 30
      on_fail: block
    - id: cron_update
      action: call_skill
      parameters:
        skill_name: vineyard_disease_risk
        repo_path: /root/goidanich
        mode: cron_daily
        disease: downy_mildew
        date: ${date}
        timeout: 900
      expect:
        status: success
      timeout: 930
      on_fail: block
      save_as: daily
    - id: pull_shared_model
      action: call_skill
      parameters:
        skill_name: vineyard_disease_risk
        repo_path: /root/goidanich
        mode: pull_model_version
        disease: downy_mildew
      expect:
        status: success
      timeout: 120
      on_fail: continue
    - id: status
      action: call_skill
      parameters:
        skill_name: vineyard_disease_risk
        repo_path: /root/goidanich
        mode: current_status
        disease: downy_mildew
      expect:
        status: success
      timeout: 30
