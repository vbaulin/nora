- id: daily_vineyard_briefing
  name: "Daily Vineyard Briefing With Risk-Only Notification"
  priority: 9
  status: template
  steps:
    - id: briefing
      action: call_skill
      parameters:
        skill_name: daily_vineyard_briefing
        mode: both_disease_report
        repo_path: /root/goidanich
        disease: downy_mildew
        days: 14
        notify: false
        notify_mode: risk_only
        board_only: true
        channel: picoclaw_telegram
        outbox_dir: /tmp/picoclaw_outbox
        memory_path: /tmp/vineyard_alert_memory.json
        high_threshold: 70
        watch_threshold: 50
        delta_threshold: 15
        cooldown_hours: 24
      expect:
        status: success
      timeout: 1200
      on_fail: block
