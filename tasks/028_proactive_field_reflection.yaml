- id: proactive_field_reflection
  name: "Evidence-Linked Proactive Field Reflection"
  priority: 8
  status: template
  steps:
    - id: observe_and_propose
      action: call_skill
      parameters:
        skill_name: proactive_field_agent
        mode: tick
        repo_path: /root/.picoclaw/workspace/goidanich
        state_dir: /root/.picoclaw/workspace/proactive_field
        notify: false
        research: false
      expect:
        status: success
      timeout: 180
      on_fail: block
      repeat:
        interval_sec: 21600
        max_iterations: 4
        journal_path: /tmp/monitors/proactive_field_reflection.jsonl
        continue_on_fail: true
    - id: inspect_pending_proposal
      action: call_skill
      parameters:
        skill_name: proactive_field_agent
        mode: next_proposal
        state_dir: /root/.picoclaw/workspace/proactive_field
      expect:
        status: success
      timeout: 30
      on_fail: continue
