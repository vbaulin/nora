<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">nano-os-agent scientific experiment control loop</title>
  <desc id="desc">A deterministic RISC-V executor connects scientific intent to tasks, hardware, evidence, and a release gate.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#193127" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#72d99b"/>
    </marker>
  </defs>

  <rect width="1200" height="460" rx="18" fill="#0b1410"/>
  <rect width="1200" height="460" rx="18" fill="url(#grid)" opacity="0.72"/>
  <path d="M0 94 H1200" stroke="#264235" stroke-width="1"/>

  <text x="60" y="48" fill="#72d99b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700">SCIENTIFIC EDGE RUNTIME / SG2002</text>
  <text x="60" y="145" fill="#f2f7f3" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="62" font-weight="760">nano-os-agent</text>
  <text x="60" y="184" fill="#b9c9bf" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">Deterministic executor for autonomous scientific experiments</text>

  <rect x="902" y="116" width="238" height="82" rx="10" fill="#10241a" stroke="#3b7353" stroke-width="1.5"/>
  <text x="924" y="145" fill="#8fa79a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">EXPERIMENT VERDICT</text>
  <circle cx="929" cy="172" r="7" fill="#72d99b"/>
  <text x="946" y="179" fill="#f2f7f3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700">evidence released</text>

  <path d="M213 311 H282 M434 311 H502 M654 311 H722 M874 311 H942" fill="none" stroke="#72d99b" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="60" y="250" width="154" height="122" rx="10" fill="#101c16" stroke="#365444" stroke-width="1.5"/>
    <text x="79" y="277" fill="#72d99b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">01 / INTENT</text>
    <text x="79" y="315" fill="#f2f7f3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700">Question</text>
    <text x="79" y="342" fill="#9db0a4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Goal + limits</text>
  </g>

  <g>
    <rect x="282" y="250" width="154" height="122" rx="10" fill="#101c16" stroke="#365444" stroke-width="1.5"/>
    <text x="301" y="277" fill="#72d99b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">02 / CONTRACT</text>
    <text x="301" y="315" fill="#f2f7f3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700">Task YAML</text>
    <text x="301" y="342" fill="#9db0a4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Steps + checks</text>
  </g>

  <g>
    <rect x="502" y="250" width="154" height="122" rx="10" fill="#173222" stroke="#72d99b" stroke-width="2"/>
    <text x="521" y="277" fill="#72d99b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">03 / EXECUTE</text>
    <text x="521" y="315" fill="#f2f7f3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700">Hardware</text>
    <text x="521" y="342" fill="#b9c9bf" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Retry + timebox</text>
  </g>

  <g>
    <rect x="722" y="250" width="154" height="122" rx="10" fill="#101c16" stroke="#365444" stroke-width="1.5"/>
    <text x="741" y="277" fill="#72d99b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">04 / RECORD</text>
    <text x="741" y="315" fill="#f2f7f3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700">Evidence</text>
    <text x="741" y="342" fill="#9db0a4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">JSONL + artifacts</text>
  </g>

  <g>
    <rect x="942" y="250" width="198" height="122" rx="10" fill="#101c16" stroke="#d7a94f" stroke-width="1.5"/>
    <text x="961" y="277" fill="#e8bc65" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">05 / RELEASE</text>
    <text x="961" y="315" fill="#f2f7f3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="700">Gate result</text>
    <text x="961" y="342" fill="#9db0a4" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Keep or quarantine</text>
  </g>

  <text x="60" y="422" fill="#789184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">MCP TOOLS  /  LOCAL SKILLS  /  EXPERIMENT JOURNALS  /  BOUNDED PROPOSALS</text>
</svg>
