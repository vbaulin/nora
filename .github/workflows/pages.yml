name: Deploy proactive-agent tutorial

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "assets/readme/**"
      - "docs/proactive-agent/**"
      - "docs/tutorial-proactive-field-companion.md"
      - "images/LicheeRV Nano.jpg"
      - "requirements-docs.txt"
      - "scripts/build_tutorial_site.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt

      - name: Build tutorial site
        run: python scripts/build_tutorial_site.py --output _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
